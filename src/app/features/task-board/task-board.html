<h1>Tasks to get Done! <span class="count">{{openCount()}}/{{totalCount()}} open</span></h1>

<div class="board">
    @for(task of tasks(); track task.id){
        <article class="sticky" [class.done]="task.done" [attr.data-color]="task.color">
            <h2>{{task.title}}</h2>
            <p>{{task.details}}</p>
            <a class="edit-glass" [routerLink]="['/tasks', task.id,'edit']">Edit</a>
            <button class="pin-remove xicon" (click)="remove(task.id)">x</button>
            <label for="taskdone">Mark task as done</label>
            <input id="taskdone" type="checkbox" [checked]="task.done" (change)="[updateTask(task.id,{done: !task.done})]" >
        </article>

    }@empty {
        <p class="empty">No Task yet. Create your first one!</p>
    }
</div>
